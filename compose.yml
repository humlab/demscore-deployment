services:
  router:
    image: nginx:1.27-alpine
    container_name: demscore-router
    depends_on:
      - web
      - mapserver
      - web-backend
    ports:
      - "8090:80"
    volumes:
      - ./router/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: demscore-postgis
    environment:
      POSTGRES_DB: demscore
      POSTGRES_USER: demscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demscore}
    ports:
      - "5532:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./data/Demscore_Module_Vars:/datasets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demscore -d demscore"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mapserver:
    image: camptocamp/mapserver:8.4
    container_name: demscore-mapserver
    depends_on:
      db:
        condition: service_healthy
    environment:
      MS_MAPFILE: /etc/mapserver/mapserver.map
      MS_DEBUGLEVEL: "2"
      MS_ERRORFILE: stderr
      MIN_PROCESSES: 8
      MAX_PROCESSES: 16
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demscore}
      PGPASSWORD: ${POSTGRES_PASSWORD:-demscore}
    volumes:
      - ./mapserver:/etc/mapserver:ro
    restart: unless-stopped

  web-backend:
    image: node:20-alpine
    container_name: demscore-web-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8091"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: demscore
      PGUSER: demscore
      PGPASSWORD: ${POSTGRES_PASSWORD:-demscore}
      CONFIG_DIR: /app/webapp-config
    working_dir: /app
    command: sh -lc "npm install --no-audit --no-fund && npm run start"
    volumes:
      - ./web-backend:/app
      - ./webapp/config:/app/webapp-config:ro
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: demscore-web
    depends_on:
      - mapserver
      - web-backend
    volumes:
      - ./webapp:/usr/share/nginx/html:ro
    restart: unless-stopped

  mapcache:
    image: nginx:1.27-alpine
    container_name: demscore-mapcache
    profiles: ["cache"]
    depends_on:
      - mapserver
    volumes:
      - ./mapcache/nginx.conf:/etc/nginx/nginx.conf:ro
      - mapcache_data:/var/cache/nginx
    restart: unless-stopped

volumes:
  pg_data:
  mapcache_data:
