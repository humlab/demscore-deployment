# Loaded after the camptocamp image's own mapserver.conf (compose.yml mounts it
# as zz-demscore-hardening.conf), so these settings win.
#
# The image serves Apache's extended status page at /server-status-remote to
# anyone: every request in flight, with its full URL. The router only forwards
# /mapserver to this container, but it is closed here too.
<Location "/server-status-remote">
    Require all denied
</Location>

# No Apache or Ubuntu version in response headers or error pages.
ServerTokens Prod
ServerSignature Off
