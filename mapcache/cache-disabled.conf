worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver @DNS_RESOLVER@ valid=1s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;

    location / {
      set $mapserver_upstream http://mapserver:80;
      proxy_pass $mapserver_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering on;

      # Development mode should be explicit: no server-side tile store and no
      # browser HTTP cache.
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
      add_header X-Cache-Enabled "0" always;
      add_header X-Cache-Status "BYPASS" always;
    }
  }
}
