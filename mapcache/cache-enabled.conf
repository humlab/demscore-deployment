worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Only WMS tile rendering requests are cacheable. Capabilities and errors stay
  # pass-through so metadata and debugging responses are never served stale.
  map $arg_REQUEST $demscore_cacheable_request {
    default 0;
    "~*^GetMap$" 1;
  }

  map $demscore_cacheable_request $demscore_skip_cache {
    0 1;
    1 0;
  }

  map $demscore_cacheable_request $demscore_cache_control {
    0 "no-store, no-cache, max-age=0, must-revalidate";
    1 "public, max-age=@MAPCACHE_TTL_SECONDS@";
  }

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=demscore_mapcache:100m max_size=@MAPCACHE_MAX_SIZE@ inactive=24h use_temp_path=off;

  resolver @DNS_RESOLVER@ valid=1s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;

    location / {
      set $mapserver_upstream http://mapserver:80;
      proxy_pass $mapserver_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache demscore_mapcache;
      # Cache by the WMS dimensions that affect the rendered tile, not by raw
      # query-string order. The deploy preloader and OpenLayers do not need to
      # spell equivalent GetMap requests in exactly the same parameter order.
      proxy_cache_key "$scheme$request_method$host$uri|map=$arg_map|service=$arg_SERVICE|version=$arg_VERSION|request=$arg_REQUEST|layers=$arg_LAYERS|styles=$arg_STYLES|format=$arg_FORMAT|transparent=$arg_TRANSPARENT|srs=$arg_SRS|crs=$arg_CRS|bbox=$arg_BBOX|width=$arg_WIDTH|height=$arg_HEIGHT|dataset=$arg_dataset|variable=$arg_variable|polarity=$arg_polarity|year=$arg_year|hex_size=$arg_hex_size|palette=$arg_palette";
      proxy_cache_methods GET HEAD;
      proxy_cache_min_uses 1;
      proxy_cache_lock on;
      proxy_buffering on;
      proxy_cache_valid 200 302 @MAPCACHE_TTL_SECONDS@;
      proxy_cache_valid 404 5m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_bypass $demscore_skip_cache;
      proxy_no_cache $demscore_skip_cache;

      # MapServer emits strict no-cache headers. The proxy owns tile cache policy
      # when DEMSCORE_ENABLE_MAPCACHE is enabled, so hide the upstream policy.
      proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control $demscore_cache_control always;
      add_header X-Cache-Enabled "1" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
