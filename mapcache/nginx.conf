worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Cache only WMS tile rendering requests (REQUEST=GetMap). Other endpoints are pass-through.
  map $arg_REQUEST $demscore_skip_cache {
    default 1;
    "~*^GetMap$" 0;
  }

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=demscore_mapcache:100m max_size=2g inactive=24h use_temp_path=off;

  upstream demscore_mapserver {
    server mapserver:80;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://demscore_mapserver;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache demscore_mapcache;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_min_uses 1;
      proxy_cache_lock on;
      proxy_buffering on;
      proxy_cache_valid 200 302 12h;
      proxy_cache_valid 404 5m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_bypass $demscore_skip_cache;
      proxy_no_cache $demscore_skip_cache;
      # MapServer sends strict no-cache headers; ignore these for tile caching policy.
      proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie Vary;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=43200" always;

      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
