worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver @DNS_RESOLVER@ valid=1s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;

    # API routes -> web-backend (prefix kept: /api/... stays /api/...)
    location /api {
      set $backend_upstream http://web-backend:8091;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Rewrite any Location headers from the upstream so internal hostnames/ports
      # never leak back to the browser.
      proxy_redirect http://web-backend:8091/ /;
    }

    # Health check -> web-backend
    location /healthz {
      set $backend_upstream http://web-backend:8091;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_redirect http://web-backend:8091/ /;
    }

    # MapServer WMS -> mapcache proxy (strip /mapserver prefix)
    location /mapserver {
      # `set` must precede the rewrite: `break` stops the rewrite module, so a
      # `set` placed after it never runs and proxy_pass sees an empty variable.
      set $wms_upstream http://mapcache:80;
      rewrite ^/mapserver/?(.*)$ /$1 break;
      proxy_pass $wms_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://mapcache:80/ /mapserver/;
    }

    # Everything else -> static web app
    location / {
      set $web_upstream http://web:80;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://web:80/ /;
    }
  }
}
