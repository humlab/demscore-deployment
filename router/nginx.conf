worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream web_upstream {
    server web:80;
    keepalive 16;
  }

  upstream wms_upstream {
    server mapcache:80;
    keepalive 32;
  }

  upstream backend_upstream {
    server web-backend:8091;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # API routes -> web-backend (prefix kept: /api/... stays /api/...)
    location /api {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Rewrite any Location headers from the upstream so internal hostnames/ports
      # never leak back to the browser.
      proxy_redirect http://web-backend:8091/ /;
      proxy_redirect http://backend_upstream/ /;
    }

    # Health check -> web-backend
    location /healthz {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_redirect http://web-backend:8091/ /;
    }

    # MapServer WMS -> mapcache proxy (strip /mapserver prefix)
    location /mapserver {
      rewrite ^/mapserver/?(.*)$ /$1 break;
      proxy_pass http://wms_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://mapcache:80/ /mapserver/;
    }

    # Everything else -> static web app
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://web:80/ /;
    }
  }
}
