worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream web_upstream {
    server web:80;
    keepalive 16;
  }

  upstream mapserver_upstream {
    server mapserver:80;
    keepalive 32;
  }

  upstream backend_upstream {
    server web-backend:8091;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # API routes -> web-backend (prefix kept: /api/... stays /api/...)
    location /api {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check -> web-backend
    location /healthz {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    # MapServer WMS -> mapserver (strip /mapserver prefix)
    location /mapserver {
      rewrite ^/mapserver/?(.*)$ /$1 break;
      proxy_pass http://mapserver_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> static web app
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
