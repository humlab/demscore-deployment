worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver @DNS_RESOLVER@ valid=1s ipv6=off;
  resolver_timeout 5s;

  server_tokens off;

  # The router speaks plain HTTP and expects a TLS reverse proxy in front of it,
  # so every connection arrives from that proxy. The client is the address the
  # proxy appended to X-Forwarded-For. compose.yml writes one set_real_ip_from
  # per address in DEMSCORE_TRUSTED_PROXY_CIDRS into this file.
  include /tmp/real_ip.conf;
  real_ip_header X-Forwarded-For;

  # Per-client request rates. What the limits protect is MapServer: a tile the
  # cache does not hold is a render and a database query, and nothing else stops
  # one client asking for thousands of them. A request over the rate is queued,
  # not refused, until the burst is used up; then it is a 429.
  #
  # A request from a private address is not counted. Through the reverse proxy
  # that is never the case (the client's own address is used), so it is the
  # tile preloader and other requests from the host itself.
  geo $demscore_rate_exempt {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
  }
  map $demscore_rate_exempt $demscore_rate_key {
    1       "";
    default $binary_remote_addr;
  }
  limit_req_zone $demscore_rate_key zone=demscore_wms:10m rate=50r/s;
  limit_req_zone $demscore_rate_key zone=demscore_api:10m rate=20r/s;
  limit_req_status 429;

  # What reaches MapServer is rebuilt from these parameters alone, in this
  # order, and nothing else the request carried. The tile cache keys on the whole
  # query, so a tile is stored under exactly the request that drew it: an extra
  # parameter (SLD_BODY, FILTER, ...) cannot restyle a tile that is then served
  # to everyone under the plain request, and a parameter given twice cannot be
  # keyed on its first value and drawn with its second. An absent or empty
  # parameter is left out. The map file is fixed rather than taken from `map=`.
  map $arg_SERVICE     $wms_service     { "" ""; default "&SERVICE=$arg_SERVICE"; }
  map $arg_VERSION     $wms_version     { "" ""; default "&VERSION=$arg_VERSION"; }
  map $arg_REQUEST     $wms_request     { "" ""; default "&REQUEST=$arg_REQUEST"; }
  map $arg_LAYERS      $wms_layers      { "" ""; default "&LAYERS=$arg_LAYERS"; }
  map $arg_STYLES      $wms_styles      { "" ""; default "&STYLES=$arg_STYLES"; }
  map $arg_FORMAT      $wms_format      { "" ""; default "&FORMAT=$arg_FORMAT"; }
  map $arg_TRANSPARENT $wms_transparent { "" ""; default "&TRANSPARENT=$arg_TRANSPARENT"; }
  map $arg_SRS         $wms_srs         { "" ""; default "&SRS=$arg_SRS"; }
  map $arg_CRS         $wms_crs         { "" ""; default "&CRS=$arg_CRS"; }
  map $arg_BBOX        $wms_bbox        { "" ""; default "&BBOX=$arg_BBOX"; }
  map $arg_WIDTH       $wms_width       { "" ""; default "&WIDTH=$arg_WIDTH"; }
  map $arg_HEIGHT      $wms_height      { "" ""; default "&HEIGHT=$arg_HEIGHT"; }
  map $arg_dataset     $wms_dataset     { "" ""; default "&dataset=$arg_dataset"; }
  map $arg_variable    $wms_variable    { "" ""; default "&variable=$arg_variable"; }
  map $arg_polarity    $wms_polarity    { "" ""; default "&polarity=$arg_polarity"; }
  map $arg_year        $wms_year        { "" ""; default "&year=$arg_year"; }
  map $arg_hex_size    $wms_hex_size    { "" ""; default "&hex_size=$arg_hex_size"; }
  map $arg_palette     $wms_palette     { "" ""; default "&palette=$arg_palette"; }

  server {
    listen 80;
    server_name _;

    # On every response, including the API's and the tiles'. HSTS is not here:
    # it belongs to the reverse proxy that terminates TLS
    # (deploy/nginx-vhost.conf.example). Inline styles are allowed because the
    # palette swatches are drawn with style attributes; workers from blob: URLs
    # because OpenLayers and the video encoder start theirs that way.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # No request here carries a body.
    client_max_body_size 1k;

    # API routes -> web-backend (prefix kept: /api/... stays /api/...)
    location /api {
      limit_req zone=demscore_api burst=100 delay=50;
      set $backend_upstream http://web-backend:8091;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Rewrite any Location headers from the upstream so internal hostnames/ports
      # never leak back to the browser.
      proxy_redirect http://web-backend:8091/ /;
    }

    # Health check -> web-backend
    location = /healthz {
      limit_req zone=demscore_api burst=100 delay=50;
      set $backend_upstream http://web-backend:8091;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_redirect http://web-backend:8091/ /;
    }

    # MapServer WMS -> mapcache proxy. Exactly /mapserver: the MapServer
    # container answers other paths too (Apache's status page among them), and
    # none of them is for the public.
    location = /mapserver {
      limit_req zone=demscore_wms burst=500 delay=100;
      set $wms_upstream http://mapcache:80;
      set $wms_query "map=/etc/mapserver/mapserver.map$wms_service$wms_version$wms_request$wms_layers$wms_styles$wms_format$wms_transparent$wms_srs$wms_crs$wms_bbox$wms_width$wms_height$wms_dataset$wms_variable$wms_polarity$wms_year$wms_hex_size$wms_palette";
      # With variables, proxy_pass sends this URI as it stands, without the
      # original query string.
      proxy_pass $wms_upstream/?$wms_query;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://mapcache:80/ /mapserver/;
    }

    # Everything else -> static web app
    location / {
      set $web_upstream http://web:80;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect http://web:80/ /;
    }
  }
}
